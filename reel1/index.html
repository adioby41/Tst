<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0b0e;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(120% 90% at 30% 20%, #1a1c22 0%, #0d0e12 55%, #07080a 100%);
        font-family: "Oswald", sans-serif;
        color: #f2efe9;
      }
      .layer {
        position: absolute;
        inset: 0;
      }

      /* ---------- giant background marquee ---------- */
      .marquee {
        position: absolute;
        left: 0;
        white-space: nowrap;
        display: flex;
        width: max-content;
      }
      .marquee span {
        display: block;
        padding-right: 80px;
      }
      #mq-big {
        top: 560px;
        font-size: 300px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.01em;
        color: #121318;
        -webkit-text-stroke: 2px rgba(242, 239, 233, 0.13);
        text-transform: uppercase;
      }
      #mq-small {
        top: 968px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 30px;
        font-weight: 400;
        letter-spacing: 0.28em;
        color: rgba(242, 239, 233, 0.5);
      }
      #mq-small span {
        padding-right: 0;
      }
      .rule {
        position: absolute;
        left: 0;
        right: 0;
        height: 1px;
        background: rgba(242, 239, 233, 0.14);
      }

      /* ---------- header ---------- */
      #header {
        position: absolute;
        left: 110px;
        right: 560px;
        top: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: "IBM Plex Mono", monospace;
        font-size: 26px;
        letter-spacing: 0.22em;
        color: rgba(242, 239, 233, 0.78);
      }
      #header .flag {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      #header .flag-by {
        display: block;
        width: 72px;
        height: 36px;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12);
      }

      #logo-card {
        position: absolute;
        right: 110px;
        top: 56px;
        width: 380px;
        height: 406px;
      }
      #logo-card img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      /* ---------- title ---------- */
      #title-wrap {
        position: absolute;
        left: 110px;
        top: 150px;
        width: 1500px;
        height: 420px;
      }
      #accent-bar {
        position: absolute;
        left: 0;
        top: 22px;
        width: 12px;
        height: 330px;
        background: #00adef;
        transform-origin: 50% 0%;
      }
      .title-state {
        position: absolute;
        left: 52px;
        top: 0;
      }
      .line {
        display: block;
        overflow: hidden;
        line-height: 1.04;
        padding-top: 6px;
        padding-bottom: 0.16em;
        margin-bottom: -0.16em;
      }
      .line-a {
        font-size: 172px;
        font-weight: 700;
        letter-spacing: -0.015em;
        text-transform: uppercase;
      }
      .line-b {
        font-size: 132px;
        font-weight: 400;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: #ff5fa8;
      }
      .ch {
        display: inline-block;
        will-change: transform;
      }
      .sp {
        display: inline-block;
        width: 0.26em;
      }

      /* ---------- throw ---------- */
      #throw svg {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
      #arc {
        fill: none;
        stroke: rgba(242, 239, 233, 0.55);
        stroke-width: 3;
        stroke-linecap: round;
      }
      #ground {
        stroke: rgba(242, 239, 233, 0.22);
        stroke-width: 2;
        stroke-dasharray: 6 14;
      }
      .tick {
        stroke: rgba(242, 239, 233, 0.28);
        stroke-width: 2;
      }
      #ball {
        position: absolute;
        left: 0;
        top: 0;
        width: 24px;
        height: 24px;
        margin: -12px 0 0 -12px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffffff 0%, #d9d6cf 45%, #8e8a82 100%);
        box-shadow: 0 0 34px rgba(255, 255, 255, 0.35);
      }
      #circle {
        stroke: rgba(242, 239, 233, 0.75);
        stroke-width: 6;
        stroke-linecap: round;
      }
      #toeboard {
        fill: #f2efe9;
      }
      #fig {
        fill: none;
        stroke: #f2efe9;
        stroke-width: 9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #fig-head {
        fill: #f2efe9;
      }
      #ring {
        position: absolute;
        left: 1780px;
        top: 760px;
        width: 160px;
        height: 160px;
        margin: -80px 0 0 -80px;
        border-radius: 50%;
        border: 3px solid #00adef;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <!-- background type -->
      <div id="bg" class="layer clip" data-start="0" data-duration="10" data-track-index="0">
        <div id="mq-big" class="marquee" data-layout-ignore aria-hidden="true">
          <span>Толкание ядра ·</span><span>Толкание ядра ·</span><span>Толкание ядра ·</span>
        </div>
        <div class="rule" style="top: 948px"></div>
        <div class="rule" style="top: 1022px"></div>
        <div id="mq-small" class="marquee" data-layout-allow-overflow>
          <span>ТОЛКАНИЕ ЯДРА · ЖЕНЩИНЫ · МОГИЛЁВ 2027 ·&nbsp;</span><span>ТОЛКАНИЕ ЯДРА · ЖЕНЩИНЫ · МОГИЛЁВ 2027 ·&nbsp;</span><span>ТОЛКАНИЕ ЯДРА · ЖЕНЩИНЫ · МОГИЛЁВ 2027 ·&nbsp;</span><span>ТОЛКАНИЕ ЯДРА · ЖЕНЩИНЫ · МОГИЛЁВ 2027 ·&nbsp;</span>
        </div>
      </div>

      <!-- shot trajectory -->
      <div id="throw" class="layer clip" data-start="0" data-duration="10" data-track-index="1">
        <svg viewBox="0 0 1920 1080">
          <line id="ground" x1="160" y1="760" x2="1880" y2="760" />
          <line id="circle" x1="742" y1="760" x2="904" y2="760" />
          <rect id="toeboard" x="904" y="748" width="12" height="12" />
          <line class="tick" x1="1480" y1="744" x2="1480" y2="776" />
          <line class="tick" x1="1630" y1="744" x2="1630" y2="776" />
          <line class="tick" x1="1780" y1="736" x2="1780" y2="784" />
          <path id="arc" d="M 0 0" />
          <path id="fig" d="M 0 0" />
          <circle id="fig-head" cx="0" cy="0" r="12" />
        </svg>
        <div id="ring"></div>
        <div id="ball"></div>
      </div>

      <!-- header + title -->
      <div id="fg" class="layer clip" data-start="0" data-duration="10" data-track-index="2">
        <div id="header">
          <div class="flag">
            <svg class="flag-by" viewBox="0 0 90 45" aria-label="Флаг Беларуси"><rect width="90" height="30" fill="#c8102e"/><rect y="30" width="90" height="15" fill="#007c30"/><rect width="10" height="45" fill="#fff"/><path d="M5 1 L9 7.5 L5 14 L1 7.5 Z" fill="#c8102e"/><path d="M5 4.5 L7 7.5 L5 10.5 L3 7.5 Z" fill="#fff"/><rect x="4.2" y="6.7" width="1.6" height="1.6" fill="#c8102e"/><path d="M0 0 L2 0 L0 3 Z M10 0 L8 0 L10 3 Z M0 15 L2 15 L0 12 Z M10 15 L8 15 L10 12 Z" fill="#c8102e"/><path d="M5 16 L9 22.5 L5 29 L1 22.5 Z" fill="#c8102e"/><path d="M5 19.5 L7 22.5 L5 25.5 L3 22.5 Z" fill="#fff"/><rect x="4.2" y="21.7" width="1.6" height="1.6" fill="#c8102e"/><path d="M0 15 L2 15 L0 18 Z M10 15 L8 15 L10 18 Z M0 30 L2 30 L0 27 Z M10 30 L8 30 L10 27 Z" fill="#c8102e"/><path d="M5 31 L9 37.5 L5 44 L1 37.5 Z" fill="#c8102e"/><path d="M5 34.5 L7 37.5 L5 40.5 L3 37.5 Z" fill="#fff"/><rect x="4.2" y="36.7" width="1.6" height="1.6" fill="#c8102e"/><path d="M0 30 L2 30 L0 33 Z M10 30 L8 30 L10 33 Z M0 45 L2 45 L0 42 Z M10 45 L8 45 L10 42 Z" fill="#c8102e"/></svg>
            <span>ОТКРЫТЫЙ ЧЕМПИОНАТ РЕСПУБЛИКИ БЕЛАРУСЬ В ПОМЕЩЕНИИ</span>
          </div>
        </div>
        <div id="logo-card"><img src="assets/logo-2027-dark-bg.svg" alt="Открытый чемпионат Республики Беларусь в помещении по лёгкой атлетике, Могилёв 2027" /></div>
        <div id="title-wrap" data-layout-allow-overlap>
          <div id="accent-bar"></div>
          <div class="title-state" id="state-1">
            <span class="line line-a" data-layout-allow-overflow data-text="Толкание ядра"></span>
            <span class="line line-b" data-layout-allow-overflow data-text="Женщины"></span>
          </div>
        </div>
      </div>
    </div>

    <script>
      // split title lines into letters (setup only, deterministic)
      document.querySelectorAll(".line").forEach((line) => {
        const text = line.dataset.text;
        line.innerHTML = "";
        line.setAttribute("data-layout-allow-overflow", "");
        for (const c of text) {
          const s = document.createElement("span");
          if (c === " ") {
            s.className = "sp";
          } else {
            s.className = "ch";
            s.textContent = c;
          }
          line.appendChild(s);
        }
      });

      const LOOP = 10;
      const tl = gsap.timeline({ paused: true });

      // ---- marquees: one full repeat per loop, seamless ----
      tl.fromTo("#mq-big", { xPercent: 0 }, { xPercent: -100 / 3, duration: LOOP, ease: "none" }, 0);
      tl.fromTo("#mq-small", { xPercent: -25 }, { xPercent: 0, duration: LOOP, ease: "none" }, 0);

      // ---- title: one slow refresh per loop, settled at t=0 and t=10 ----
      const s1 = (sel) => `#state-1 ${sel} .ch`;
      tl.set([s1(".line-a"), s1(".line-b")], { yPercent: 0 }, 0);
      tl.to(s1(".line-a"), { yPercent: -140, duration: 0.8, ease: "power2.in", stagger: 0.04 }, 7.6);
      tl.to(s1(".line-b"), { yPercent: -140, duration: 0.8, ease: "power2.in", stagger: 0.04 }, 7.75);
      tl.fromTo(s1(".line-a"), { yPercent: 140 }, { yPercent: 0, duration: 0.85, ease: "power2.out", stagger: 0.03 }, 8.8);
      tl.fromTo(s1(".line-b"), { yPercent: 140 }, { yPercent: 0, duration: 0.8, ease: "power2.out", stagger: 0.03 }, 8.9);
      tl.to("#accent-bar", { scaleY: 0, duration: 0.8, ease: "power2.in" }, 7.6);
      tl.to("#accent-bar", { scaleY: 1, duration: 0.9, ease: "power2.out" }, 8.85);

      // ---- shot put, glide technique: stance, crouch, glide across the circle, power position, put; then only the shot flies ----
      const fig = document.getElementById("fig");
      const head = document.getElementById("fig-head");
      const arc = document.getElementById("arc");
      const ball = document.getElementById("ball");
      const G = 760, S = 1.4;
      const B = { torso: 34 * S, neck: 13 * S, upper: 17 * S, fore: 17 * S, thigh: 23 * S, shin: 22 * S };
      const HIP = G - (B.thigh + B.shin) + 4;
      const D2R = Math.PI / 180;
      const lerp = (a, b, k) => a + (b - a) * k;
      const smooth = (k) => { k = Math.max(0, Math.min(1, k)); return k * k * (3 - 2 * k); };

      // [time, hipX, hipY, rotation]; facing the back of the circle until the turn
      const KEYS = [
        [0.30, 775, HIP, 0],          // stance, back to the sector, shot at the neck
        [0.85, 768, HIP + 18, -55],   // crouch over the support leg
        [1.25, 850, HIP + 16, -50],   // glide backwards across the circle
        [1.50, 872, HIP + 12, -28],   // power position
        [1.62, 880, HIP + 8, -6],     // turning
        [1.85, 892, HIP - 6, 16],     // put, full extension
        [2.30, 900, HIP, 10],         // follow-through
        [5.40, 900, HIP, 8],
      ];
      // [throwArm, elbow, freeArm, elbow, leg1 (support), knee1, leg2, knee2]; angles from "down along the body", positive toward the front
      const POSES = [
        [0.30, [62, 100, 110, 10, 0, 0, -6, 6]],
        [0.85, [62, 100, 95, 15, 60, 75, 70, 115]],
        [1.25, [62, 100, 95, 15, 30, 12, -72, 8]],
        [1.50, [62, 100, 100, 15, 22, 55, -48, 6]],
        [1.62, [70, 95, 40, 40, -12, 20, 14, 20]],
        [1.85, [140, 0, -40, 60, -26, 0, 16, 6]],
        [2.30, [100, 25, -20, 50, -10, 15, 25, 30]],
        [5.40, [10, 20, -10, 25, -4, 4, 6, 6]],
      ];
      const TURN = 1.6, RELEASE = 1.85;
      const seg = (list, t) => {
        if (t <= list[0][0]) return [0, 0];
        for (let j = 1; j < list.length; j++) if (t <= list[j][0]) return [j - 1, smooth((t - list[j - 1][0]) / (list[j][0] - list[j - 1][0]))];
        return [list.length - 2, 1];
      };
      const skeleton = (t) => {
        let [j, k] = seg(KEYS, t);
        const A = KEYS[j], C = KEYS[j + 1];
        const h = { x: lerp(A[1], C[1], k), y: lerp(A[2], C[2], k), rot: lerp(A[3], C[3], k) };
        [j, k] = seg(POSES, t);
        const P = POSES[j][1].map((v, i) => lerp(v, POSES[j + 1][1][i], k));
        const face = t < TURN ? -1 : 1;
        const r = h.rot * D2R, c = Math.cos(r), sn = Math.sin(r);
        const W = (lx, ly) => ({ x: h.x + (face * lx) * c - ly * sn, y: h.y + (face * lx) * sn + ly * c });
        const dir = (deg) => [Math.sin(deg * D2R), Math.cos(deg * D2R)];
        const limb = (ox, oy, a1, l1, a2, l2) => {
          const [x1, y1] = dir(a1), [x2, y2] = dir(a2);
          const jn = [ox + x1 * l1, oy + y1 * l1];
          return [W(ox, oy), W(jn[0], jn[1]), W(jn[0] + x2 * l2, jn[1] + y2 * l2)];
        };
        const sh = -B.torso + 5;
        return {
          hip: W(0, 0), neck: W(0, -B.torso), head: W(0, -B.torso - B.neck),
          arm1: limb(0, sh, P[0], B.upper, P[0] + P[1], B.fore),
          arm2: limb(0, sh, P[2], B.upper, P[2] + P[3], B.fore),
          leg1: limb(0, 0, P[4], B.thigh, P[4] - P[5], B.shin),
          leg2: limb(0, 0, P[6], B.thigh, P[6] - P[7], B.shin),
        };
      };
      const pl = (pts) => "M " + pts.map((q) => `${q.x.toFixed(1)} ${q.y.toFixed(1)}`).join(" L ");

      // ballistic flight from the release point: x linear in time, y quadratic (a true parabola)
      const R = skeleton(RELEASE).arm1[2];
      const LAND = { x: 1780, y: G - 10 }, APEX_Y = 480, FLIGHT = 2.0;
      let cy = R.y - 400;
      {
        // control point height so the apex sits at APEX_Y
        let lo = -2000, hi = R.y;
        for (let i = 0; i < 60; i++) {
          const m = (lo + hi) / 2, tt = (R.y - m) / (R.y - 2 * m + LAND.y);
          const yA = (1 - tt) * (1 - tt) * R.y + 2 * tt * (1 - tt) * m + tt * tt * LAND.y;
          if (yA < APEX_Y) lo = m; else hi = m;
        }
        cy = (lo + hi) / 2;
      }
      const cx = (R.x + LAND.x) / 2;
      arc.setAttribute("d", `M ${R.x.toFixed(1)} ${R.y.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${LAND.x} ${LAND.y}`);
      const LEN = arc.getTotalLength();
      arc.setAttribute("stroke-dasharray", LEN.toFixed(1));
      arc.setAttribute("stroke-dashoffset", LEN.toFixed(1));
      gsap.set("#ring", { scale: 0.2, opacity: 0 });

      const draw = (t) => {
        const k = skeleton(t);
        fig.setAttribute("d", [pl([k.hip, k.neck]), pl(k.arm1), pl(k.arm2), pl(k.leg1), pl(k.leg2)].join(" "));
        head.setAttribute("cx", k.head.x.toFixed(1));
        head.setAttribute("cy", k.head.y.toFixed(1));
        let bx, by;
        if (t <= RELEASE) {
          const hnd = k.arm1[2]; bx = hnd.x; by = hnd.y;
          arc.setAttribute("stroke-dashoffset", LEN.toFixed(1));
        } else {
          const q = Math.min(1, (t - RELEASE) / FLIGHT), u = 1 - q;
          bx = u * u * R.x + 2 * u * q * cx + q * q * LAND.x;
          by = u * u * R.y + 2 * u * q * cy + q * q * LAND.y;
          // trail drawn to the same parameter (dash on the path)
          arc.setAttribute("stroke-dashoffset", (LEN * (1 - arcFrac(q))).toFixed(1));
        }
        gsap.set(ball, { x: bx, y: by });
      };
      // arc length fraction for a curve parameter, sampled once
      const FR = (() => {
        const n = 200, out = [0]; let acc = 0, px = R.x, py = R.y;
        for (let i = 1; i <= n; i++) {
          const q = i / n, u = 1 - q;
          const x = u * u * R.x + 2 * u * q * cx + q * q * LAND.x, y = u * u * R.y + 2 * u * q * cy + q * q * LAND.y;
          acc += Math.hypot(x - px, y - py); out.push(acc); px = x; py = y;
        }
        return out.map((v) => v / acc);
      })();
      function arcFrac(q) { const f = q * 200, i = Math.min(199, Math.floor(f)); return lerp(FR[i], FR[i + 1], f - i); }

      draw(0);
      {
        const clock = { t: 0 }, END = RELEASE + FLIGHT, land = END;
        tl.set([fig, head, ball], { opacity: 0 }, 0);
        tl.to([fig, head, ball], { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);
        tl.set(arc, { opacity: 1, attr: { "stroke-dashoffset": LEN } }, 0);
        tl.to(clock, { t: END, duration: END, ease: "none", onUpdate: () => draw(clock.t) }, 0);
        // landing
        tl.set("#ring", { scale: 0.2, opacity: 1 }, land);
        tl.to("#ring", { scale: 1.5, opacity: 0, duration: 1.6, ease: "power2.out" }, land);
        tl.to([fig, head], { opacity: 0, duration: 0.8, ease: "power1.inOut" }, 5.4);
        tl.to([arc, ball], { opacity: 0, duration: 1.0, ease: "power1.inOut" }, 6.2);
      }

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
