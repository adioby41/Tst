<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0b0e;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(120% 90% at 30% 20%, #1a1c22 0%, #0d0e12 55%, #07080a 100%);
        font-family: "Oswald", sans-serif;
        color: #f2efe9;
      }
      .layer {
        position: absolute;
        inset: 0;
      }

      /* ---------- giant background marquee ---------- */
      .marquee {
        position: absolute;
        left: 0;
        white-space: nowrap;
        display: flex;
        width: max-content;
      }
      .marquee span {
        display: block;
        padding-right: 80px;
      }
      #mq-big {
        top: 560px;
        font-size: 270px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.01em;
        color: #121318;
        -webkit-text-stroke: 2px rgba(242, 239, 233, 0.13);
        text-transform: uppercase;
      }
      #mq-small {
        top: 968px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 30px;
        font-weight: 400;
        letter-spacing: 0.28em;
        color: rgba(242, 239, 233, 0.5);
      }
      #mq-small span {
        padding-right: 0;
      }
      .rule {
        position: absolute;
        left: 0;
        right: 0;
        height: 1px;
        background: rgba(242, 239, 233, 0.14);
      }

      /* ---------- header ---------- */
      #header {
        position: absolute;
        left: 110px;
        right: 560px;
        top: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: "IBM Plex Mono", monospace;
        font-size: 26px;
        letter-spacing: 0.22em;
        color: rgba(242, 239, 233, 0.78);
      }
      #header .flag {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      #header .flag-by {
        display: block;
        width: 72px;
        height: 36px;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12);
      }

      #logo-card {
        position: absolute;
        right: 110px;
        top: 56px;
        width: 380px;
        height: 406px;
      }
      #logo-card img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      /* ---------- title ---------- */
      #title-wrap {
        position: absolute;
        left: 110px;
        top: 150px;
        width: 1500px;
        height: 420px;
      }
      #accent-bar {
        position: absolute;
        left: 0;
        top: 22px;
        width: 12px;
        height: 330px;
        background: #00adef;
        transform-origin: 50% 0%;
      }
      .title-state {
        position: absolute;
        left: 52px;
        top: 0;
      }
      .line {
        display: block;
        overflow: hidden;
        line-height: 1.04;
        padding-top: 6px;
        padding-bottom: 0.16em;
        margin-bottom: -0.16em;
      }
      .line-a {
        font-size: 138px;
        font-weight: 700;
        letter-spacing: -0.015em;
        text-transform: uppercase;
      }
      .line-b {
        font-size: 132px;
        font-weight: 400;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: #00adef;
      }
      .ch {
        display: inline-block;
        will-change: transform;
      }
      .sp {
        display: inline-block;
        width: 0.26em;
      }

      /* ---------- throw ---------- */
      #throw svg {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
      #arc {
        fill: none;
        stroke: rgba(242, 239, 233, 0.55);
        stroke-width: 3;
        stroke-linecap: round;
      }
      #ground {
        stroke: rgba(242, 239, 233, 0.22);
        stroke-width: 2;
        stroke-dasharray: 6 14;
      }
      .tick {
        stroke: rgba(242, 239, 233, 0.28);
        stroke-width: 2;
      }
      #ball {
        position: absolute;
        left: 0;
        top: 0;
        width: 34px;
        height: 34px;
        margin: -17px 0 0 -17px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffffff 0%, #d9d6cf 45%, #8e8a82 100%);
        box-shadow: 0 0 34px rgba(255, 255, 255, 0.35);
      }
      .upright {
        stroke: rgba(242, 239, 233, 0.45);
        stroke-width: 4;
      }
      #crossbar-end {
        fill: #f2efe9;
      }
      .pin {
        stroke-width: 3;
      }
      .mat {
        fill: rgba(242, 239, 233, 0.06);
        stroke: rgba(242, 239, 233, 0.3);
        stroke-width: 2;
      }
      #vaulter {
        position: absolute;
        left: 0;
        top: 0;
        width: 160px;
        height: 160px;
        margin: -80px 0 0 -80px;
      }
      #vaulter svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      #vaulter circle {
        fill: #f2efe9;
      }
      #vaulter path {
        fill: none;
        stroke: #f2efe9;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #pole {
        fill: none;
        stroke: #f2efe9;
        stroke-width: 4;
        stroke-linecap: round;
      }
      #box {
        fill: rgba(242, 239, 233, 0.5);
      }
      #arc {
        stroke: rgba(242, 239, 233, 0.28);
        stroke-dasharray: 2 10;
      }
      #ring {
        position: absolute;
        left: 1740px;
        top: 812px;
        width: 160px;
        height: 160px;
        margin: -80px 0 0 -80px;
        border-radius: 50%;
        border: 3px solid #00adef;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <!-- background type -->
      <div id="bg" class="layer clip" data-start="0" data-duration="10" data-track-index="0">
        <div id="mq-big" class="marquee" data-layout-ignore aria-hidden="true">
          <span>Прыжок с шестом ·</span><span>Прыжок с шестом ·</span><span>Прыжок с шестом ·</span>
        </div>
        <div class="rule" style="top: 948px"></div>
        <div class="rule" style="top: 1022px"></div>
        <div id="mq-small" class="marquee" data-layout-allow-overflow>
          <span>ПРЫЖОК С ШЕСТОМ · МУЖЧИНЫ · МОГИЛЁВ 2027 ·&nbsp;</span><span>ПРЫЖОК С ШЕСТОМ · МУЖЧИНЫ · МОГИЛЁВ 2027 ·&nbsp;</span><span>ПРЫЖОК С ШЕСТОМ · МУЖЧИНЫ · МОГИЛЁВ 2027 ·&nbsp;</span><span>ПРЫЖОК С ШЕСТОМ · МУЖЧИНЫ · МОГИЛЁВ 2027 ·&nbsp;</span>
        </div>
      </div>

      <!-- shot trajectory -->
      <div id="throw" class="layer clip" data-start="0" data-duration="10" data-track-index="1">
        <svg viewBox="0 0 1920 1080">
          <line id="ground" x1="160" y1="860" x2="1880" y2="860" />
          <rect class="mat" x="1636" y="812" width="244" height="48" />
          <line class="upright" x1="1624" y1="860" x2="1624" y2="596" />
          <line class="upright pin" x1="1624" y1="612" x2="1606" y2="612" />
          <circle id="crossbar-end" cx="1606" cy="612" r="9" />
          <path id="box" d="M 1560 860 L 1606 860 L 1606 874 Z" />
          <path id="arc" d="M 1180 826 C 1370 826 1480 770 1530 650 C 1562 560 1590 522 1622 522 C 1676 522 1722 640 1740 800" />
          <path id="pole" d="M 0 0" />
        </svg>
        <div id="ring"></div>
        <div id="vaulter">
          <svg viewBox="-80 -80 160 160">
            <circle cx="0" cy="-50" r="10" />
            <path d="M 0 -38 L 0 0 M 0 -32 L 12 -62 M 0 -30 L 4 -60 M 0 0 L -12 36 M 0 0 L 12 32" />
          </svg>
        </div>
      </div>

      <!-- header + title -->
      <div id="fg" class="layer clip" data-start="0" data-duration="10" data-track-index="2">
        <div id="header">
          <div class="flag">
            <svg class="flag-by" viewBox="0 0 90 45" aria-label="Флаг Беларуси"><rect width="90" height="30" fill="#c8102e"/><rect y="30" width="90" height="15" fill="#007c30"/><rect width="10" height="45" fill="#fff"/><path d="M5 1 L9 7.5 L5 14 L1 7.5 Z" fill="#c8102e"/><path d="M5 4.5 L7 7.5 L5 10.5 L3 7.5 Z" fill="#fff"/><rect x="4.2" y="6.7" width="1.6" height="1.6" fill="#c8102e"/><path d="M0 0 L2 0 L0 3 Z M10 0 L8 0 L10 3 Z M0 15 L2 15 L0 12 Z M10 15 L8 15 L10 12 Z" fill="#c8102e"/><path d="M5 16 L9 22.5 L5 29 L1 22.5 Z" fill="#c8102e"/><path d="M5 19.5 L7 22.5 L5 25.5 L3 22.5 Z" fill="#fff"/><rect x="4.2" y="21.7" width="1.6" height="1.6" fill="#c8102e"/><path d="M0 15 L2 15 L0 18 Z M10 15 L8 15 L10 18 Z M0 30 L2 30 L0 27 Z M10 30 L8 30 L10 27 Z" fill="#c8102e"/><path d="M5 31 L9 37.5 L5 44 L1 37.5 Z" fill="#c8102e"/><path d="M5 34.5 L7 37.5 L5 40.5 L3 37.5 Z" fill="#fff"/><rect x="4.2" y="36.7" width="1.6" height="1.6" fill="#c8102e"/><path d="M0 30 L2 30 L0 33 Z M10 30 L8 30 L10 33 Z M0 45 L2 45 L0 42 Z M10 45 L8 45 L10 42 Z" fill="#c8102e"/></svg>
            <span>ОТКРЫТЫЙ ЧЕМПИОНАТ РЕСПУБЛИКИ БЕЛАРУСЬ В ПОМЕЩЕНИИ</span>
          </div>
        </div>
        <div id="logo-card"><img src="assets/logo-2027-dark-bg.svg" alt="Открытый чемпионат Республики Беларусь в помещении по лёгкой атлетике, Могилёв 2027" /></div>
        <div id="title-wrap" data-layout-allow-overlap>
          <div id="accent-bar"></div>
          <div class="title-state" id="state-1">
            <span class="line line-a" data-layout-allow-overflow data-text="Прыжок с шестом"></span>
            <span class="line line-b" data-layout-allow-overflow data-text="Мужчины"></span>
          </div>
        </div>
      </div>
    </div>

    <script>
      // split title lines into letters (setup only, deterministic)
      document.querySelectorAll(".line").forEach((line) => {
        const text = line.dataset.text;
        line.innerHTML = "";
        line.setAttribute("data-layout-allow-overflow", "");
        for (const c of text) {
          const s = document.createElement("span");
          if (c === " ") {
            s.className = "sp";
          } else {
            s.className = "ch";
            s.textContent = c;
          }
          line.appendChild(s);
        }
      });

      const LOOP = 10;
      const tl = gsap.timeline({ paused: true });

      // ---- marquees: one full repeat per loop, seamless ----
      tl.fromTo("#mq-big", { xPercent: 0 }, { xPercent: -100 / 3, duration: LOOP, ease: "none" }, 0);
      tl.fromTo("#mq-small", { xPercent: -25 }, { xPercent: 0, duration: LOOP, ease: "none" }, 0);

      // ---- title: one slow refresh per loop, settled at t=0 and t=10 ----
      const s1 = (sel) => `#state-1 ${sel} .ch`;
      tl.set([s1(".line-a"), s1(".line-b")], { yPercent: 0 }, 0);
      tl.to(s1(".line-a"), { yPercent: -140, duration: 0.8, ease: "power2.in", stagger: 0.04 }, 7.6);
      tl.to(s1(".line-b"), { yPercent: -140, duration: 0.8, ease: "power2.in", stagger: 0.04 }, 7.75);
      tl.fromTo(s1(".line-a"), { yPercent: 140 }, { yPercent: 0, duration: 0.85, ease: "power2.out", stagger: 0.03 }, 8.8);
      tl.fromTo(s1(".line-b"), { yPercent: 140 }, { yPercent: 0, duration: 0.8, ease: "power2.out", stagger: 0.03 }, 8.9);
      tl.to("#accent-bar", { scaleY: 0, duration: 0.8, ease: "power2.in" }, 7.6);
      tl.to("#accent-bar", { scaleY: 1, duration: 0.9, ease: "power2.out" }, 8.85);

      // ---- pole vault: run-up with pole, plant, swing, bar clearance, landing ----
      const arc = document.getElementById("arc");
      const pole = document.getElementById("pole");
      const vaulter = document.getElementById("vaulter");
      const LEN = arc.getTotalLength();
      const N = 300;
      const PTS = Array.from({ length: N + 1 }, (_, i) => arc.getPointAtLength((LEN * i) / N));
      const RUN_X0 = 640, Y_RUN = 826, BOX = { x: 1600, y: 860 }, POLE = 420;
      const HANDS = { x: 11, y: -61 };

      const lerp = (a, b, k) => a + (b - a) * k;
      const onArc = (q) => {
        const f = q * N, i = Math.min(N - 1, Math.floor(f)), k = f - i;
        return { x: lerp(PTS[i].x, PTS[i + 1].x, k), y: lerp(PTS[i].y, PTS[i + 1].y, k) };
      };
      // body rotation over the vault: rock back, invert along the pole, turn over the bar, fall on the back
      const ROT = [[0, 0], [0.3, -110], [0.5, -178], [0.66, -225], [1, -262]];
      const rotAt = (q) => {
        for (let j = 1; j < ROT.length; j++) {
          if (q <= ROT[j][0]) {
            const [q0, r0] = ROT[j - 1], [q1, r1] = ROT[j];
            return lerp(r0, r1, (q - q0) / (q1 - q0));
          }
        }
        return ROT[ROT.length - 1][1];
      };
      const handsAt = (hip, deg) => {
        const r = (deg * Math.PI) / 180, c = Math.cos(r), sn = Math.sin(r);
        return { x: hip.x + HANDS.x * c - HANDS.y * sn, y: hip.y + HANDS.x * sn + HANDS.y * c };
      };
      const straightPole = (from, ang, len) =>
        `M ${from.x} ${from.y} L ${from.x + Math.cos(ang) * len} ${from.y + Math.sin(ang) * len}`;

      // pole release moment, computed once so the fall-away is deterministic
      const Q_REL = 0.5;
      const relHands = handsAt(onArc(Q_REL), rotAt(Q_REL));
      const relAng = Math.atan2(relHands.y - BOX.y, relHands.x - BOX.x);

      const runFrame = (r) => {
        const hip = { x: lerp(RUN_X0, PTS[0].x, r), y: Y_RUN };
        const h = handsAt(hip, 0);
        gsap.set(vaulter, { x: hip.x, y: hip.y, rotation: 0 });
        gsap.set(pole, { attr: { d: straightPole(h, 0.23, POLE) }, opacity: 1 });
      };
      const vaultFrame = (q) => {
        const hip = onArc(q), deg = rotAt(q);
        gsap.set(vaulter, { x: hip.x, y: hip.y, rotation: deg });
        if (q <= Q_REL) {
          const h = handsAt(hip, deg);
          const dx = h.x - BOX.x, dy = h.y - BOX.y, d = Math.hypot(dx, dy);
          const sag = Math.min(70, Math.max(0, POLE - d) * 0.45);
          // bend bulges forward, toward the bar
          const nx = -dy / d, ny = dx / d, sgn = nx > 0 ? 1 : -1;
          const cx = (BOX.x + h.x) / 2 + nx * sag * sgn, cy = (BOX.y + h.y) / 2 + ny * sag * sgn;
          gsap.set(pole, { attr: { d: `M ${BOX.x} ${BOX.y} Q ${cx} ${cy} ${h.x} ${h.y}` }, opacity: 1 });
        } else {
          // released pole falls back toward the runway and fades
          const k = Math.min(1, (q - Q_REL) / 0.3);
          const ang = lerp(relAng, -Math.PI * 0.92, k * k);
          gsap.set(pole, { attr: { d: straightPole(BOX, ang, POLE) }, opacity: 1 - k });
        }
      };

      gsap.set(arc, { strokeDashoffset: 0, opacity: 0 });
      gsap.set("#ring", { scale: 0.2, opacity: 0 });
      gsap.set([vaulter, pole], { opacity: 0 });
      runFrame(0);

      {
        const RUN = 0.9, VAULT = 2.3, land = RUN + VAULT;
        const run = { r: 0 }, fly = { q: 0 };
        tl.set([vaulter, pole], { opacity: 0 }, 0);
        tl.to([vaulter, pole], { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);
        tl.to(run, { r: 1, duration: RUN, ease: "none", onUpdate: () => runFrame(run.r) }, 0);
        tl.to(fly, { q: 1, duration: VAULT, ease: "sine.inOut", onUpdate: () => vaultFrame(fly.q) }, RUN);
        tl.fromTo(arc, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, RUN);
        // landing on the mat
        tl.set("#ring", { scale: 0.2, opacity: 1 }, land);
        tl.to("#ring", { scale: 1.5, opacity: 0, duration: 1.6, ease: "power2.out" }, land);
        // clear well before the loop edge
        tl.to([arc, vaulter], { opacity: 0, duration: 1.0, ease: "power1.inOut" }, 6.2);
      }

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
